[project]
name = "bibletools"
version = "0.1.0"
description = "Toolkit for working with the Bible"
authors = [
    {name="Jireh Huang", email="ijirehhuang@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "numpy>=2.3.2,<3.0.0",
    "pythonbible>=0.15.0,<0.16.0",
    "defusedxml (>=0.7.1,<0.8.0)",
    "word2number (>=1.1,<2.0)",
]

[tool.poetry]
packages = [{ include = "bibletools" }]

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
ruff = "^0.16.5"
flake8 = "^7.3.0"
pydoclint = "^0.9.1"
mypy = "^2.3.1"
pylint = "^4.0.7"
commitizen = "^4.18.0"
pre-commit = "^4.6.2"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-randomly = "^4.1.0"
python-dotenv = "^1.2.3"
types-defusedxml = "^0.7.0.20260504"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools]
include-package-data = true

# -------------------
# Tool Configurations
# -------------------

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"
fix = true

[tool.ruff.lint]
select = ["B", "D", "E", "ERA", "F", "I", "N", "PL", "RUF", "W"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D205",  # missing-blank-line-after-summary
    "D209",  # new-line-after-last-paragraph
    "PLR2004",  # Magic value used in comparison
]
"scripts/*" = [
    "ERA001"  # commented-out
]
"__init__.py" = ["F401"]  # unused-import

[tool.pydoclint]
style = "numpy"
arg-type-hints-in-docstring = false
return-type-hints-in-docstring = false
check-return-types = false
require-return-section-when-returning-nothing = false
skip-checking-raises = true

[tool.pylint.'MESSAGES CONTROL']
disable = ["C0114", "C0115", "C0116"]  # allow missing docstrings in tests
max-line-length = 79

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
addopts = "-v --cov=bibletools --cov-report=term-missing --cov-report=xml:coverage.xml"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]
